name: Validate and deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: arrow-adventure-production-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ github.sha }}
    steps:
      - name: Checkout the exact production candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run complete tests
        run: npm test

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Build the production Pages path
        run: npm run build -- --base=/arrow-adventure/

      - name: Verify production artifact and exclude QA tools
        run: node scripts/verify-production-build.mjs dist

      - name: Stamp production source revision
        env:
          SOURCE_SHA: ${{ github.sha }}
          PRODUCTION_WORKFLOW_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/stamp-production-build.mjs dist "$SOURCE_SHA" "$PRODUCTION_WORKFLOW_RUN"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload validated production artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy the validated artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout the deployed source for verification
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify the live production page, metadata, and assets
        env:
          EXPECTED_SHA: ${{ needs.build.outputs.source_sha }}
          EXPECTED_WORKFLOW_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/verify-production-deployment.mjs "$EXPECTED_SHA" "$EXPECTED_WORKFLOW_RUN"
