name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: arrow-adventure-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ github.sha }}
      qa_run_url: ${{ steps.qa.outputs.run_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Require this exact revision to be deployed on QA
        id: qa
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          qa_record="$(curl -fsSL https://mirpkered.github.io/arrow-adventure-qa/qa-deployment.json)"
          qa_sha="$(jq -r '.sourceCommit // empty' <<< "$qa_record")"
          if [[ "$qa_sha" != "$EXPECTED_SHA" ]]; then
            echo "Refusing production deployment: QA currently reports '$qa_sha', expected '$EXPECTED_SHA'." >&2
            exit 1
          fi
          qa_run="$(jq -r '.workflowRun // empty' <<< "$qa_record")"
          run_id="${qa_run##*/}"
          if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
            echo "QA deployment record does not contain a valid workflow run URL." >&2
            exit 1
          fi
          run_info="$(curl -fsSL "https://api.github.com/repos/mirpkered/arrow-adventure-qa/actions/runs/$run_id")"
          if [[ "$(jq -r '.status' <<< "$run_info")" != "completed" || "$(jq -r '.conclusion' <<< "$run_info")" != "success" ]]; then
            echo "Refusing production deployment: the referenced QA workflow did not complete successfully." >&2
            exit 1
          fi
          echo "run_url=$qa_run" >> "$GITHUB_OUTPUT"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify live QA assets and source traceability
        run: node scripts/verify-qa-deployment.mjs "${{ github.sha }}"
      - name: Install dependencies
        run: npm ci
      - name: Run tests and typecheck
        run: npm test && npm run typecheck
      - name: Build
        run: npm run build -- --base=/arrow-adventure/
      - name: Confirm production excludes QA modules
        run: |
          if compgen -G 'dist/assets/qaPanel-*.js' >/dev/null || compgen -G 'dist/assets/prototypeReview-*.js' >/dev/null; then
            echo "Production build unexpectedly includes a QA-only JavaScript module." >&2
            exit 1
          fi
          if grep -R -E -q 'Prototype Review|prototype-square-true-7|qa-deployment\.json' dist --include='*.js' --include='*.html' --include='*.json'; then
            echo "Production build unexpectedly includes QA-only prototype content or metadata." >&2
            exit 1
          fi
      - name: Stamp production source revision
        env:
          SOURCE_SHA: ${{ github.sha }}
          QA_RUN_URL: ${{ steps.qa.outputs.run_url }}
          PRODUCTION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/stamp-production-build.mjs dist "$SOURCE_SHA" "$QA_RUN_URL" "$PRODUCTION_RUN_URL"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Confirm QA still serves this exact source revision
        env:
          EXPECTED_SHA: ${{ needs.build.outputs.source_sha }}
          EXPECTED_QA_RUN: ${{ needs.build.outputs.qa_run_url }}
        run: |
          qa_record="$(curl -fsSL https://mirpkered.github.io/arrow-adventure-qa/qa-deployment.json)"
          if [[ "$(jq -r '.sourceCommit // empty' <<< "$qa_record")" != "$EXPECTED_SHA" || "$(jq -r '.workflowRun // empty' <<< "$qa_record")" != "$EXPECTED_QA_RUN" ]]; then
            echo "Refusing production deployment: QA changed after the production build." >&2
            exit 1
          fi
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
